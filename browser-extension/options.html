<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Quietube Redirector — Options</title>
<style>
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; max-width: 420px; margin: 24px; color: #1a1a1a; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type="text"] { width: 100%; padding: 6px 8px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
  .status { margin-top: 10px; font-size: 12px; color: #2a7a2a; height: 14px; }
</style>
</head>
<body>
  <h2>Quietube Redirector</h2>

  <label for="origin">Quietube app URL</label>
  <input id="origin" type="text" placeholder="https://quietube.pplx.app" />

  <div class="row">
    <input id="enabled" type="checkbox" />
    <label for="enabled" style="margin:0;">Enabled</label>
  </div>

  <div class="row">
    <input id="redirectHome" type="checkbox" />
    <label for="redirectHome" style="margin:0;">Also redirect the YouTube homepage / channel pages (not just watch &amp; search)</label>
  </div>

  <button id="save">Save</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
